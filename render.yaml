services:
  - type: web
    name: pt-agency-v2
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: HTTPS
        value: "1"
      - key: DB_PATH
        value: /tmp/pt.sqlite3
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
